[package]
name = "usc"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.33"
libloading = "0.8"
lofty = "0.22"
whatlang = "0.16"

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal"] }

[dev-dependencies]
tempfile = "3"
