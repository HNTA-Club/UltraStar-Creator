name: Rust Package
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: usc
      - name: Prepare target directories for ort-sys dylib copy
        shell: bash
        working-directory: usc
        run: mkdir -p target/debug/examples target/debug/deps target/debug/build/examples target/debug/build/deps target/release/examples target/release/deps target/release/build/examples target/release/build/deps
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: usc
      - run: cargo test
        working-directory: usc
      - run: cargo build --release
        working-directory: usc

      - name: Stage and verify Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -Force -ItemType Directory dist, bass-tmp, fx-tmp | Out-Null
          curl.exe -fsSL -o bass.zip https://www.un4seen.com/files/bass24.zip
          curl.exe -fsSL -o bass_fx.zip https://www.un4seen.com/files/z/0/bass_fx24.zip
          Expand-Archive -Path bass.zip -DestinationPath bass-tmp -Force
          Expand-Archive -Path bass_fx.zip -DestinationPath fx-tmp -Force
          Copy-Item usc/target/release/usc.exe dist/
          $dml = Get-ChildItem -Recurse usc/target -Filter DirectML.dll | Select-Object -First 1
          if ($dml) { Copy-Item $dml.FullName dist/ }
          Copy-Item bass-tmp/x64/bass.dll dist/
          Copy-Item fx-tmp/x64/bass_fx.dll dist/
          Copy-Item syllabification/*.txt dist/
          & .\dist\usc.exe --check-bass
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/* -DestinationPath WIN64-UltraStar-Creator-portable.zip -Force

      - name: Stage and verify Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/lib bass-tmp fx-tmp
          curl -fsSL -o bass.zip https://www.un4seen.com/files/bass24-linux.zip
          curl -fsSL -o bass_fx.zip https://www.un4seen.com/files/z/0/bass_fx24-linux.zip
          unzip -q bass.zip -d bass-tmp
          unzip -q bass_fx.zip -d fx-tmp
          cp usc/target/release/usc dist/
          cp bass-tmp/libs/x86_64/libbass.so dist/lib/
          cp fx-tmp/libs/x86_64/libbass_fx.so dist/lib/
          cp syllabification/*.txt dist/
          cp setup/linux/UltraStar-Creator.desktop setup/linux/UltraStar-Creator.png dist/
          ./dist/usc --check-bass
          tar -czf LINUX-UltraStar-Creator-portable.tar.gz -C dist .

      - name: Stage and verify macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="dist/UltraStar-Creator.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" bass-tmp fx-tmp
          curl -fsSL -o bass.zip https://www.un4seen.com/files/bass24-osx.zip
          curl -fsSL -o bass_fx.zip https://www.un4seen.com/files/z/0/bass_fx24-osx.zip
          unzip -q bass.zip -d bass-tmp
          unzip -q bass_fx.zip -d fx-tmp
          cp usc/target/release/usc "$APP/Contents/MacOS/"
          cp bass-tmp/libbass.dylib "$APP/Contents/MacOS/"
          cp fx-tmp/libbass_fx.dylib "$APP/Contents/MacOS/"
          cp syllabification/*.txt "$APP/Contents/Resources/"
          cp src/resources/UltraStar-Creator.icns "$APP/Contents/Resources/"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '  <key>CFBundleExecutable</key><string>usc</string>' \
            '  <key>CFBundleIdentifier</key><string>org.ultrastar.creator</string>' \
            '  <key>CFBundleName</key><string>UltraStar-Creator</string>' \
            '  <key>CFBundleIconFile</key><string>UltraStar-Creator.icns</string>' \
            '  <key>CFBundlePackageType</key><string>APPL</string>' \
            '</dict></plist>' > "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          "./$APP/Contents/MacOS/usc" --check-bass
          (cd dist && zip -r ../MAC-ARM-UltraStar-Creator-portable.zip UltraStar-Creator.app)

      - name: Upload portable archive
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.os }}-UltraStar-Creator-portable
          path: "*-UltraStar-Creator-portable.*"
          if-no-files-found: error
