name: Rust
on:
  push:
    branches: ['**']
    paths: ['usc/**', 'syllabification/**', 'setup/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['usc/**', 'syllabification/**', 'setup/**', '.github/workflows/rust.yml']

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ORT_CACHE_DIR: ${{ github.workspace }}/.ci-cache/ort
      LINDERA_BUILD_DICTIONARY_CACHE_DIR: ${{ github.workspace }}/.ci-cache/lindera
    defaults:
      run:
        working-directory: usc
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v5
        with:
          path: .ci-cache
          key: ${{ runner.os }}-ci-cache-v2-${{ hashFiles('usc/Cargo.lock') }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: usc
          prefix-key: v2-rust
      - name: Prepare target directories for ort-sys dylib copy
        shell: bash
        run: |
          if [ ! -d "../.ci-cache/lindera" ] || [ ! -d "../.ci-cache/ort" ]; then
            rm -rf target/*/build/lindera-ipadic* target/*/build/ort-sys* target/*/.fingerprint/lindera-ipadic* target/*/.fingerprint/ort-sys*
          fi
          mkdir -p target/debug/examples target/debug/deps target/debug/build/examples target/debug/build/deps
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
