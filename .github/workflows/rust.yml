name: Rust
on:
  push:
    branches: ['**']
    paths: ['usc/**', 'syllabification/**', 'setup/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['usc/**', 'syllabification/**', 'setup/**', '.github/workflows/rust.yml']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: usc
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v5
        with:
          path: |
            usc/target/ort-cache
            usc/target/lindera-cache
          key: ${{ runner.os }}-ort-lindera-${{ hashFiles('usc/Cargo.lock') }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: usc
      - name: Prepare target directories for ort-sys dylib copy
        shell: bash
        run: mkdir -p target/debug/examples target/debug/deps target/debug/build/examples target/debug/build/deps
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
