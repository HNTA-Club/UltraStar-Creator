name: Rust
on:
  push:
    branches: ['**']
    paths: ['usc/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['usc/**', '.github/workflows/rust.yml']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: usc
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: usc
      - name: Prepare target directories for ort-sys dylib copy
        shell: bash
        run: mkdir -p target/debug/examples target/debug/deps target/debug/build/examples target/debug/build/deps
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
